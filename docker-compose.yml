# Local development stack. Only the app for now; PostgreSQL (and Blob-style
# artefact storage) arrive with hosted mode in v1.0.
services:
  helionyx:
    build: .
    command: ["helionyx", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"   # development-grade bearer key only: keep on localhost
    environment:
      HNX_API_KEY: ${HNX_API_KEY:?set HNX_API_KEY to a random string}
      HNX_WORKSPACE: /data
      HNX_LOG_LEVEL: INFO
    volumes:
      - helionyx-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  helionyx-data:
