<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Get started with Helionyx</title>
  <desc id="d">Step 1: install in Claude Code with one command, in Claude Desktop with a one-click bundle, or in any MCP client with uvx helionyx serve. Step 2: ask for a design in plain language. Step 3: get ranked designs with costs, bills and a reproducible run ID.</desc>
  <rect width="1200" height="440" rx="20" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="58" font-size="28" font-weight="700" fill="#F8FAFC">Get started in three steps</text>
    <text x="48" y="88" font-size="16" fill="#94A3B8">Install once, then size systems in conversation. No HOMER licence, no Python setup in Claude Desktop.</text>

    <!-- Step 1: install options -->
    <text x="48" y="132" font-size="15" font-weight="700" fill="#FBBF24">1  INSTALL (pick one)</text>
    <rect x="48" y="146" width="420" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="70" y="176" font-size="17" font-weight="700" fill="#F8FAFC">Claude Code</text>
    <text x="70" y="202" font-size="14" fill="#7DD3FC" font-family="Consolas, Menlo, monospace">claude mcp add helionyx -- uvx helionyx serve</text>
    <rect x="48" y="230" width="420" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="70" y="260" font-size="17" font-weight="700" fill="#F8FAFC">Claude Desktop</text>
    <text x="70" y="286" font-size="14" fill="#CBD5E1">Open the .mcpb bundle from the latest release</text>
    <rect x="48" y="314" width="420" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="70" y="344" font-size="17" font-weight="700" fill="#F8FAFC">Any MCP client or Smithery</text>
    <text x="70" y="370" font-size="14" fill="#7DD3FC" font-family="Consolas, Menlo, monospace">uvx helionyx serve</text>

    <!-- Step 2: ask -->
    <text x="524" y="132" font-size="15" font-weight="700" fill="#38BDF8">2  ASK</text>
    <path d="M524 150 H820 Q836 150 836 166 V300 Q836 316 820 316 H600 L572 344 L578 316 H540 Q524 316 524 300 V166 Q524 150 540 150 Z" fill="#0F2A40" stroke="#38BDF8" stroke-width="2"/>
    <text x="546" y="186" font-size="16" fill="#E0F2FE">"Size PV and a battery for</text>
    <text x="546" y="212" font-size="16" fill="#E0F2FE">a 60-room hotel in Negombo</text>
    <text x="546" y="238" font-size="16" fill="#E0F2FE">on the CEB hotel tariff.</text>
    <text x="546" y="264" font-size="16" fill="#E0F2FE">We have 1,200 m² of roof."</text>
    <text x="546" y="296" font-size="13" fill="#7DD3FC">The assistant asks up to 3 questions</text>

    <!-- Step 3: results -->
    <text x="884" y="132" font-size="15" font-weight="700" fill="#22C55E">3  DECIDE</text>
    <rect x="884" y="146" width="268" height="240" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="904" y="166" width="228" height="34" rx="8" fill="#14532D"/>
    <text x="916" y="189" font-size="15" fill="#BBF7D0">#1  PV 175 kWp · no battery</text>
    <rect x="904" y="208" width="208" height="34" rx="8" fill="#1F3A2B"/>
    <text x="916" y="231" font-size="15" fill="#86EFAC">#2  PV 150 kWp · 100 kWh</text>
    <rect x="904" y="250" width="188" height="34" rx="8" fill="#1F2E2A"/>
    <text x="916" y="273" font-size="15" fill="#6EE7B7">#3  PV 125 kWp · 0 kWh</text>
    <text x="904" y="314" font-size="14" fill="#CBD5E1">NPC, LCOE, payback, bill</text>
    <text x="904" y="336" font-size="14" fill="#CBD5E1">before and after, CO₂</text>
    <text x="904" y="364" font-size="13" fill="#64748B" font-family="Consolas, Menlo, monospace">run_1M4B… (reproducible)</text>

    <text x="48" y="420" font-size="13" fill="#64748B">Illustrative output. Bundled Sri Lankan data are placeholders; see the disclaimer.</text>
  </g>
  <g stroke="#64748B" stroke-width="3" fill="#64748B">
    <line x1="476" y1="266" x2="508" y2="266"/><path d="M516 266 l-10 -7 v14 z"/>
    <line x1="846" y1="266" x2="868" y2="266"/><path d="M876 266 l-10 -7 v14 z"/>
  </g>
</svg>
