<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">Multi-year analysis: load growth and capacity expansion</title>
  <desc id="d">Illustration. Peak load grows 3 percent a year over a 20-year project. The initial system covers demand until year 9; an expansion stage adds PV and battery capacity at the start of year 10. Helionyx simulates the marked sample years and interpolates between them, and checks reliability constraints in every sampled year.</desc>
  <rect width="1200" height="430" rx="20" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="58" font-size="28" font-weight="700" fill="#F8FAFC">Multi-year: load growth and staged expansion</text>
    <text x="48" y="88" font-size="16" fill="#94A3B8">Illustrative. Search the initial system and the year-10 addition together; constraints hold in every sampled year.</text>
  </g>
  <!-- axes -->
  <g stroke="#334155" stroke-width="1">
    <line x1="120" y1="130" x2="1080" y2="130"/>
    <line x1="120" y1="200" x2="1080" y2="200"/>
    <line x1="120" y1="270" x2="1080" y2="270"/>
  </g>
  <line x1="120" y1="340" x2="1090" y2="340" stroke="#64748B" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="340" stroke="#64748B" stroke-width="2"/>
  <!-- expansion region -->
  <rect x="574" y="120" width="506" height="220" fill="#38BDF8" fill-opacity="0.07"/>
  <line x1="574" y1="120" x2="574" y2="340" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- installed capacity step -->
  <path d="M120 226 H574 V139 H1080" fill="none" stroke="#22C55E" stroke-width="4"/>
  <!-- load growth curve -->
  <polyline points="120,305 170,300 221,294 272,289 322,283 372,277 423,271 474,265 524,258 574,252 625,245 676,238 726,230 776,223 827,215 878,207 928,199 978,191 1029,182 1080,173" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
  <!-- sample years: 1, 6, 9, 10, 15, 20 -->
  <g fill="#0B1220" stroke="#F59E0B" stroke-width="3">
    <circle cx="120" cy="305" r="7"/><circle cx="372" cy="277" r="7"/><circle cx="524" cy="258" r="7"/>
    <circle cx="574" cy="252" r="7"/><circle cx="827" cy="215" r="7"/><circle cx="1080" cy="173" r="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94A3B8" text-anchor="middle">
    <text x="120" y="364">Year 1</text>
    <text x="372" y="364">6</text>
    <text x="524" y="364">9</text>
    <text x="574" y="364">10</text>
    <text x="827" y="364">15</text>
    <text x="1080" y="364">20</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="590" y="172" font-size="16" font-weight="700" fill="#7DD3FC">Expansion stage, year 10</text>
    <text x="590" y="194" font-size="15" fill="#BAE6FD">+50 kWp PV, +150 kWh battery</text>
    <text x="300" y="216" font-size="16" fill="#86EFAC">Installed capacity</text>
    <text x="760" y="262" font-size="16" fill="#FCD34D">Peak load, +3 % a year</text>
    <!-- legend -->
    <circle cx="128" cy="396" r="7" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/>
    <text x="144" y="401" font-size="15" fill="#CBD5E1">Simulated sample year (others interpolated)</text>
    <rect x="520" y="389" width="28" height="14" fill="#38BDF8" fill-opacity="0.25"/>
    <text x="558" y="401" font-size="15" fill="#CBD5E1">Expanded system in service</text>
  </g>
</svg>
