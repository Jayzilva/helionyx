<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">How a Helionyx run works</title>
  <desc id="d">Four stages: describe the site, load and tariff in conversation; simulate every candidate design hour by hour for a year; discard designs that break constraints; rank the rest by net present cost and explain them with a reproducible run ID.</desc>
  <rect width="1200" height="420" rx="20" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="60" font-size="30" font-weight="700" fill="#F8FAFC">How a run works</text>
    <text x="48" y="92" font-size="17" fill="#94A3B8">The assistant asks and explains. Every number comes from a deterministic, reproducible solver run.</text>

    <rect x="48" y="128" width="252" height="256" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="88" cy="170" r="22" fill="#F59E0B"/>
    <text x="88" y="178" font-size="22" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>
    <text x="124" y="178" font-size="21" font-weight="700" fill="#F8FAFC">Describe</text>
    <text x="72" y="226" font-size="16" fill="#CBD5E1">Site and weather data,</text>
    <text x="72" y="250" font-size="16" fill="#CBD5E1">load profile, tariff,</text>
    <text x="72" y="274" font-size="16" fill="#CBD5E1">components and limits</text>
    <rect x="72" y="306" width="204" height="48" rx="10" fill="#0F172A"/>
    <text x="174" y="336" font-size="15" fill="#FBBF24" text-anchor="middle" font-family="Consolas, Menlo, monospace">create_scenario</text>

    <rect x="332" y="128" width="252" height="256" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="372" cy="170" r="22" fill="#38BDF8"/>
    <text x="372" y="178" font-size="22" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
    <text x="408" y="178" font-size="21" font-weight="700" fill="#F8FAFC">Simulate</text>
    <g fill="#F59E0B">
      <rect x="360" y="262" width="12" height="14"/><rect x="376" y="250" width="12" height="26"/>
      <rect x="392" y="234" width="12" height="42"/><rect x="408" y="220" width="12" height="56"/>
      <rect x="424" y="214" width="12" height="62"/><rect x="440" y="222" width="12" height="54"/>
      <rect x="456" y="238" width="12" height="38"/><rect x="472" y="254" width="12" height="22"/>
    </g>
    <g fill="#38BDF8">
      <rect x="492" y="244" width="12" height="32"/><rect x="508" y="238" width="12" height="38"/>
      <rect x="524" y="248" width="12" height="28"/><rect x="540" y="256" width="12" height="20"/>
    </g>
    <line x1="356" y1="278" x2="560" y2="278" stroke="#475569" stroke-width="2"/>
    <text x="356" y="312" font-size="16" fill="#CBD5E1">Every candidate for 8,760 h:</text>
    <text x="356" y="336" font-size="16" fill="#CBD5E1">PV, wind, battery, genset</text>
    <text x="356" y="360" font-size="16" fill="#CBD5E1">and grid dispatch (Numba)</text>

    <rect x="616" y="128" width="252" height="256" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="656" cy="170" r="22" fill="#14B8A6"/>
    <text x="656" y="178" font-size="22" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>
    <text x="692" y="178" font-size="21" font-weight="700" fill="#F8FAFC">Filter</text>
    <path d="M652 210 H832 L774 260 V296 L710 316 V260 Z" fill="#14B8A6" fill-opacity="0.22" stroke="#14B8A6" stroke-width="2"/>
    <g fill="#F8FAFC">
      <circle cx="676" cy="222" r="4"/><circle cx="706" cy="230" r="4"/><circle cx="742" cy="222" r="4"/>
      <circle cx="776" cy="230" r="4"/><circle cx="806" cy="222" r="4"/><circle cx="742" cy="276" r="4"/>
      <circle cx="742" cy="296" r="4"/>
    </g>
    <text x="640" y="346" font-size="16" fill="#CBD5E1">Unmet load, renewable</text>
    <text x="640" y="370" font-size="16" fill="#CBD5E1">share, genset hours, capital</text>

    <rect x="900" y="128" width="252" height="256" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="940" cy="170" r="22" fill="#22C55E"/>
    <text x="940" y="178" font-size="22" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>
    <text x="976" y="178" font-size="19" font-weight="700" fill="#F8FAFC">Rank and explain</text>
    <rect x="924" y="206" width="204" height="30" rx="8" fill="#14532D"/>
    <text x="936" y="226" font-size="15" fill="#BBF7D0">#1  PV 150 kWp, 200 kWh</text>
    <rect x="924" y="242" width="184" height="30" rx="8" fill="#1F3A2B"/>
    <text x="936" y="262" font-size="15" fill="#86EFAC">#2  PV 200 kWp, 100 kWh</text>
    <rect x="924" y="278" width="164" height="30" rx="8" fill="#1F2E2A"/>
    <text x="936" y="298" font-size="15" fill="#6EE7B7">#3  PV 100 kWp, 200 kWh</text>
    <text x="924" y="346" font-size="16" fill="#CBD5E1">Lowest NPC first, with a</text>
    <text x="924" y="370" font-size="16" fill="#CBD5E1">run ID and provenance</text>
  </g>
  <g stroke="#64748B" stroke-width="3" fill="#64748B">
    <line x1="302" y1="256" x2="320" y2="256"/><path d="M330 256 l-10 -7 v14 z"/>
    <line x1="586" y1="256" x2="604" y2="256"/><path d="M614 256 l-10 -7 v14 z"/>
    <line x1="870" y1="256" x2="888" y2="256"/><path d="M898 256 l-10 -7 v14 z"/>
  </g>
</svg>
