name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing (OIDC):
# no API token is stored in the repository. Configure the trusted publisher once on
# pypi.org (project helionyx -> Publishing -> GitHub: Jayzilva/helionyx, workflow publish.yml,
# environment pypi).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
