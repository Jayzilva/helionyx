name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      HNX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests packages
      - name: Type-check core
        run: uv run --no-sync mypy src/helionyx/core
      - name: Validate data pack
        run: uv run --no-sync helionyx pack validate src/helionyx/packs/lk
      - name: Tests
        run: uv run --no-sync pytest --cov=helionyx --cov-report=term

  supply-chain:
    name: licences and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies only
        run: |
          uv venv
          uv pip install . pip-audit pip-licenses
      - name: Vulnerability scan
        run: uv run --no-sync pip-audit
      - name: Licence check (no GPL/AGPL in the core)
        run: uv run --no-sync pip-licenses --partial-match --fail-on "GNU General Public License;GNU Affero General Public License;GPL;AGPL"
      # Release workflow (to add): generate a CycloneDX SBOM with `cyclonedx-py environment`
      # and attach it to each GitHub release (NFR-SEC-06).
